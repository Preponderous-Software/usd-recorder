name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install "ruff==0.17.1"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

  cpp:
    name: C++ header (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Compile the scenario with warnings as errors
        run: |
          ${{ matrix.cxx }} --version
          ${{ matrix.cxx }} -std=c++17 -Wall -Wextra -Werror -pedantic -I cpp/include \
            cpp/tests/scenario.cpp -o scenario
          ./scenario run.usda
          head -20 run.usda
      - name: Compile the replay scenario with warnings as errors
        run: |
          ${{ matrix.cxx }} -std=c++17 -Wall -Wextra -Werror -pedantic -I cpp/include \
            cpp/tests/replay_scenario.cpp -o replay_scenario
          ./replay_scenario replay.usda
          head -30 replay.usda
